name: Collect prices & deploy

on:
  schedule:
    - cron: "17 * * * *"   # hourly; off-the-hour to dodge GitHub's cron congestion
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect price snapshot
        run: python3 collector/collect.py

      - name: Commit updated history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/history.json
          git diff --cached --quiet || git commit -m "data: price snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
